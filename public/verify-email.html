<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Verify Email • Online Academy</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f8fafc;color:#0f172a;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:min(100%,520px);background:#fff;border:1px solid #e2e8f0;border-radius:28px;padding:38px 30px;box-shadow:0 24px 70px rgba(15,23,42,.12);text-align:center}.brand{width:64px;height:64px;border-radius:18px;background:#2563eb;display:grid;place-items:center;margin:0 auto 22px;box-shadow:0 12px 28px rgba(37,99,235,.24)}.brand span{color:#fff;font-size:28px;font-weight:900}.badge{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:#eff6ff;color:#1d4ed8;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.icon{width:72px;height:72px;border-radius:22px;display:grid;place-items:center;margin:20px auto 18px;font-size:34px}.success .icon{background:#dcfce7;color:#059669}.error .icon{background:#fee2e2;color:#dc2626}.loading .icon{background:#eff6ff;color:#2563eb}.spinner{width:28px;height:28px;border:4px solid #bfdbfe;border-top-color:#2563eb;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}h1{margin:0;font-size:28px;line-height:1.15;font-weight:900;letter-spacing:-.03em}p{margin:12px 0 0;color:#64748b;font-size:15px;line-height:1.7}.actions{display:flex;gap:10px;justify-content:center;margin-top:24px;flex-wrap:wrap}a{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border-radius:13px;text-decoration:none;font-size:13px;font-weight:900}.primary{background:#2563eb;color:#fff;box-shadow:0 8px 18px rgba(37,99,235,.2)}.secondary{border:1px solid #e2e8f0;color:#334155;background:#fff}.note{margin-top:18px;font-size:11px;color:#94a3b8}.hidden{display:none}@media(max-width:480px){.card{padding:30px 20px;border-radius:24px}h1{font-size:24px}}
  </style>
</head>
<body>
  <main class="card loading" id="card" aria-live="polite">
    <div class="brand"><span>OA</span></div>
    <div class="badge">Online Academy • Account Security</div>
    <div class="icon" id="icon"><div class="spinner"></div></div>
    <h1 id="title">Verifying your email…</h1>
    <p id="message">Please wait while we securely confirm your email address.</p>
    <div class="actions hidden" id="actions">
      <a class="primary" href="https://online-academy-plum.vercel.app/profile">Open My Profile</a>
      <a class="secondary" href="https://online-academy-plum.vercel.app/">Go to Online Academy</a>
    </div>
    <div class="note" id="note">This secure verification link can only be used once.</div>
  </main>

  <script>
    const card = document.getElementById('card');
    const icon = document.getElementById('icon');
    const title = document.getElementById('title');
    const message = document.getElementById('message');
    const actions = document.getElementById('actions');
    const note = document.getElementById('note');

    const setState = (type, heading, text, emoji, showActions = true) => {
      card.className = `card ${type}`;
      icon.innerHTML = `<span>${emoji}</span>`;
      title.textContent = heading;
      message.textContent = text;
      actions.classList.toggle('hidden', !showActions);
      note.textContent = type === 'success'
        ? 'Your Online Academy account is now verified.'
        : 'If the link has expired, return to your profile and request a new verification email.';
    };

    const params = new URLSearchParams(window.location.search);
    const mode = params.get('mode');
    const oobCode = params.get('oobCode');
    const apiKey = params.get('apiKey');

    const verify = async () => {
      if (mode !== 'verifyEmail' || !oobCode || !apiKey) {
        setState('error', 'Invalid verification link', 'This verification link is incomplete or no longer valid. Please request a new verification email from your profile.', '×');
        return;
      }

      try {
        const response = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:update?key=${encodeURIComponent(apiKey)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ oobCode }),
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          const code = data?.error?.message || '';
          if (code === 'EXPIRED_OOB_CODE') {
            setState('error', 'Verification link expired', 'This link has expired. Please return to Online Academy and send yourself a fresh verification email.', '⏱');
          } else if (code === 'INVALID_OOB_CODE') {
            setState('error', 'Verification link is no longer valid', 'The link may already have been used or is no longer valid. Please request a new verification email.', '×');
          } else {
            setState('error', 'Verification could not be completed', 'Please request a fresh verification email and try again.', '×');
          }
          return;
        }

        setState('success', 'Email verified successfully', 'Your email address has been confirmed. You can now continue using Online Academy.', '✓');
      } catch (error) {
        console.error('Email verification handler error:', error);
        setState('error', 'Something went wrong', 'We could not complete verification right now. Please try again with a fresh email.', '×');
      }
    };

    verify();
  </script>
</body>
</html>
