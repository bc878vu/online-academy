name: Repair course player patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-course-player.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Remove accidental parent-state declaration
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/CourseDetails.jsx')
          s = p.read_text()
          s = s.replace('  const [attendanceReady, setAttendanceReady] = useState(initialProgress?.completed === true || requiredPercent === 0);\n  const [selectedIndex, setSelectedIndex] = useState(0);', '  const [selectedIndex, setSelectedIndex] = useState(0);')
          s = s.replace('  const attendanceThresholdReached = completedRef.current || requiredPercent === 0 || percent >= requiredPercent;\n', '')
          p.write_text(s)
          PY
          grep -q 'const \[attendanceReady, setAttendanceReady\]' src/pages/CourseDetails.jsx
          ! grep -q 'initialProgress?.completed === true || requiredPercent === 0);' <(sed -n '840,870p' src/pages/CourseDetails.jsx)
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/CourseDetails.jsx
          git commit -m 'fix: repair course player state declaration'
          git push
