name: Run course player fix

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch player
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("src/pages/CourseDetails.jsx")
          s = p.read_text(encoding="utf-8")

          if "const lessonKey = `${courseId}:${lesson?.id || \"\"}:${user?.uid || \"\"}`;" not in s:
              s = s.replace(
                  "  useEffect(() => {\n    const base = initialProgress ||",
                  "  const lessonKey = `${courseId}:${lesson?.id || \"\"}:${user?.uid || \"\"}`;\n\n  useEffect(() => {\n    const base = initialProgress ||",
                  1,
              )
              s = s.replace(
                  "  }, [courseId, initialProgress, lesson?.id, user]);",
                  "  }, [lessonKey]);",
                  1,
              )

          s = s.replace(
              '''    const active =\n      document.visibilityState === "visible" &&\n      document.hasFocus() &&\n      playingRef.current &&\n      !bufferingRef.current;''',
              '''    const pageVisible = document.visibilityState === "visible";\n    const pageFocused = typeof document.hasFocus !== "function" || document.hasFocus();\n    const mobileViewport = window.matchMedia?.("(max-width: 767px)").matches;\n    const active = pageVisible && (mobileViewport || pageFocused) && playingRef.current && !bufferingRef.current;''',
              1,
          )

          s = s.replace(
              "                setPlaying(true);\n                lastTickRef.current = Date.now();",
              "                setPlaying(true);\n                setPlayerReady(true);\n                lastTickRef.current = Date.now();",
              1,
          )

          s = s.replace(
              "{(!playerReady || buffering) && source.type !== \"none\" && source.type !== \"invalid\" && !error && (",
              "{((!playerReady && !playing) || (buffering && !playing)) && source.type !== \"none\" && source.type !== \"invalid\" && !error && (",
              1,
          )

          s = s.replace(
              'className="flex flex-wrap items-center gap-1.5 text-white sm:gap-2"',
              'className="flex flex-col gap-2 text-white sm:flex-row sm:items-center sm:justify-between sm:gap-3"',
              1,
          )
          s = s.replace(
              'className="w-14 shrink-0 accent-blue-500 sm:w-16 lg:w-20"',
              'className="hidden w-14 shrink-0 accent-blue-500 sm:block sm:w-16 lg:w-20"',
              1,
          )
          s = s.replace(
              'className="inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-white/10 hover:bg-white/20" aria-label="Picture in picture"',
              'className="hidden h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-white/10 hover:bg-white/20 sm:flex" aria-label="Picture in picture"',
              1,
          )

          p.write_text(s, encoding="utf-8")

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CourseDetails.jsx
          git diff --cached --quiet || (git commit -m "fix: course attendance and responsive player [player-fix]" && git push)

      - name: Close trigger issue
        if: always()
        run: gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --comment "Course player fix workflow completed."
        env:
          GH_TOKEN: ${{ github.token }}
