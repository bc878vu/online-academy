name: Fix course video player

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply player fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          course = Path("src/pages/CourseDetails.jsx")
          css = Path("src/index.css")
          text = course.read_text(encoding="utf-8")

          text, n = re.subn(r"https://www\.youtube-nocookie\.com/embed/", "https://www.youtube.com/embed/", text, count=1)
          if n != 1:
              raise SystemExit(f"Expected 1 YouTube embed URL replacement, got {n}")

          text, n = re.subn(r"\n\s*allowFullScreen\n", "\n", text, count=1)
          if n != 1:
              raise SystemExit(f"Expected 1 allowFullScreen removal, got {n}")

          marker = '  const [error, setError] = useState("");\n'
          insert = '''  const [error, setError] = useState("");
  const [attendanceReady, setAttendanceReady] = useState(
    initialProgress?.completed === true || requiredPercent === 0,
  );
'''
          if marker not in text:
              raise SystemExit("Attendance state marker not found")
          text = text.replace(marker, insert, 1)

          marker = '  const persistRef = useRef(null);\n'
          insert = '''  const persistRef = useRef(null);
  const attendanceReadyRef = useRef(
    initialProgress?.completed === true || requiredPercent === 0,
  );
'''
          if marker not in text:
              raise SystemExit("Attendance ref marker not found")
          text = text.replace(marker, insert, 1)

          marker = '  useEffect(() => { persistRef.current = persist; }, [persist]);\n'
          insert = '''  useEffect(() => { persistRef.current = persist; }, [persist]);

  useEffect(() => {
    if (initialProgress?.completed === true || requiredPercent === 0) {
      attendanceReadyRef.current = true;
      setAttendanceReady(true);
    }
  }, [initialProgress?.completed, requiredPercent]);
'''
          if marker not in text:
              raise SystemExit("Attendance sync effect marker not found")
          text = text.replace(marker, insert, 1)

          marker = '    completedRef.current = completed;\n    stateRef.current.completed = completed;\n'
          insert = '''    completedRef.current = completed;
    stateRef.current.completed = completed;
    if (completed && !attendanceReadyRef.current) {
      attendanceReadyRef.current = true;
      setAttendanceReady(true);
    }
'''
          if marker not in text:
              raise SystemExit("Persist completion marker not found")
          text = text.replace(marker, insert, 1)

          marker = '''      stateRef.current.earned = next;
      setEarnedSeconds(next);
    }

    lastTickRef.current = now;
'''
          insert = '''      stateRef.current.earned = next;
      setEarnedSeconds(next);

      const watchPercent =
        stateRef.current.duration > 0
          ? Math.min(100, Math.floor((next / stateRef.current.duration) * 100))
          : 0;
      if (watchPercent >= requiredPercent && !attendanceReadyRef.current) {
        attendanceReadyRef.current = true;
        setAttendanceReady(true);
      }
    }

    lastTickRef.current = now;
'''
          if marker not in text:
              raise SystemExit("Active-time marker not found")
          text = text.replace(marker, insert, 1)

          marker = '''    setPlayerReady(false);
    setError("");
    setSyncState("idle");
    setShowControls(false);
  }, [lessonKey]);
'''
          insert = '''    setPlayerReady(false);
    setError("");
    setSyncState("idle");
    attendanceReadyRef.current =
      base.completed === true || requiredPercent === 0;
    setAttendanceReady(attendanceReadyRef.current);
    setShowControls(false);
  }, [lessonKey]);
'''
          if marker not in text:
              raise SystemExit("Lesson reset marker not found")
          text = text.replace(marker, insert, 1)

          old = '''        {((!playerReady && !playing) || (buffering && !playing)) && source.type !== "none" && source.type !== "invalid" && !error && (
          <div className="pointer-events-none absolute inset-0 z-20 flex items-center justify-center">
            <div className="flex items-center gap-2 rounded-xl bg-slate-900/90 px-4 py-3 text-xs font-bold text-white shadow-xl">
              <Loader2 className="animate-spin" size={16} />
              {buffering ? "Buffering…" : "Loading video…"}
            </div>
          </div>
        )}
'''
          new = '''        {!playerReady && !playing && !buffering && source.type !== "none" && source.type !== "invalid" && !error && (
          <div className="pointer-events-none absolute inset-0 z-20 flex items-center justify-center">
            <div className="flex items-center gap-2 rounded-xl bg-slate-900/90 px-4 py-3 text-xs font-bold text-white shadow-xl">
              <Loader2 className="animate-spin" size={16} />
              Loading video…
            </div>
          </div>
        )}
'''
          if old not in text:
              raise SystemExit("Loading overlay block not found")
          text = text.replace(old, new, 1)

          old = '  const attendanceReady = completedRef.current || requiredPercent === 0 || percent >= requiredPercent;\n'
          if old not in text:
              raise SystemExit("Derived attendanceReady line not found")
          text = text.replace(old, "", 1)

          course.write_text(text, encoding="utf-8")

          css = Path("src/index.css")
          css_text = css.read_text(encoding="utf-8")
          if "/* Final course media stability overrides */" not in css_text:
              css_text += r'''

/* Final course media stability overrides */
#lesson-player section {
  width: 100% !important;
  max-width: 100% !important;
}

#lesson-player section > div:first-child {
  width: 100% !important;
  max-width: 100% !important;
  aspect-ratio: 16 / 9 !important;
}

#lesson-player section iframe,
#lesson-player section video {
  display: block !important;
  width: 100% !important;
  height: 100% !important;
  max-width: 100% !important;
}

#lesson-player section:fullscreen,
#lesson-player section:-webkit-full-screen {
  width: 100vw !important;
  height: 100dvh !important;
  max-width: 100vw !important;
  max-height: 100dvh !important;
}

#lesson-player section:fullscreen > div:first-child,
#lesson-player section:-webkit-full-screen > div:first-child {
  height: auto !important;
  min-height: 0 !important;
  max-height: calc(100dvh - 48px) !important;
  aspect-ratio: auto !important;
}

@media (max-width: 639px) {
  #lesson-player section {
    border-radius: 16px !important;
  }

  #lesson-player section > div:first-child {
    aspect-ratio: 16 / 9 !important;
  }

  #lesson-player section [class*="inset-x-0"][class*="bottom-0"] {
    padding: 42px 8px 8px !important;
  }

  #lesson-player section [class*="flex-col"][class*="text-white"] {
    width: 100% !important;
    min-width: 0 !important;
  }

  #lesson-player section [class*="flex-col"][class*="text-white"] > div:first-child,
  #lesson-player section [class*="flex-col"][class*="text-white"] > div:last-child {
    min-width: 0 !important;
    width: 100% !important;
  }

  #lesson-player section [class*="flex-col"][class*="text-white"] button,
  #lesson-player section [class*="flex-col"][class*="text-white"] select {
    min-height: 34px !important;
  }

  #lesson-player section [class*="flex-col"][class*="text-white"] > div:last-child {
    justify-content: flex-end !important;
  }
}

@media (max-width: 380px) {
  #lesson-player section [class*="flex-col"][class*="text-white"] button {
    width: 32px !important;
    height: 32px !important;
  }

  #lesson-player section [class*="flex-col"][class*="text-white"] select {
    width: 52px !important;
    padding-left: 2px !important;
    padding-right: 2px !important;
  }
}
'''
          css.write_text(css_text, encoding="utf-8")
          print("Applied course video/player fixes")

      - name: Verify production build
        run: |
          npm install
          npm run build

      - name: Commit and push fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CourseDetails.jsx src/index.css
          git status --short
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: stabilize course video player and attendance UI"
          git push origin main
